serial:
  # auto：按 /dev/serial/by-id/*-if02-port0 自动找 AT 口（EM05 上是 ttyUSB2，L610 上是 ttyUSB0，
  # 换机器不用改配置）；填具体路径则以配置为准。
  device: auto
  baud_rate: 115200

module:
  # auto | em05-ce | em05-cn | em05-cn-a03 | em05-cn-a04 | fibocom-l610
  type: auto
  version_file: /etc/mmdc/4g_version
  # 识别到模块后把版本号写回上面的文件（自维护缓存），厂商的 4G-info-get.service 可以永久停用
  version_file_write: true
  # auto | at | external
  #   auto：读 AT+QCFG="usbnet"，QMI(0) 视为外部拨号工具负责，其余走 AT 上下行
  #   at：本服务用 AT+cgact 之类命令做数据上下行
  #   external：数据拨号完全交给 quectel-CM，本服务不发任何拨号命令
  data_mode: auto

# auto：读卡里的 IMSI 判断运营商，自动用移动 cmnet / 联通 3gnet / 电信 ctnet
# 填具体值：以这里为准（物联网卡、定向卡等非标 APN 用这条），不再按运营商覆盖
# 注意：QMI 模式（quectel-CM 拨号）还要把同一个 APN 传给 quectel-CM 的 -s 参数
apn: auto

keepalive:
  enabled: true
  check_interval: 300s
  retry_interval: 10s
  redial_threshold: 5
  reset_threshold: 10

grpc:
  listen: 127.0.0.1:50051

log:
  level: info
  format: text
